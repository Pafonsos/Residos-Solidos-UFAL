<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #F3F4F6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: white;
      border-radius: 12px;
      border: 1px solid #E5E7EB;
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .card-label {
      font-size: 13px;
      color: #6B7280;
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 28px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 12px;
      color: #9CA3AF;
    }

    .card-icon {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-icon svg {
      width: 22px;
      height: 22px;
      stroke: white;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="cards">

    <div class="card">
      <div>
        <p class="card-label">População Total</p>
        <p class="card-value">419.950</p>
        <p class="card-subtitle">habitantes</p>
      </div>
      <div class="card-icon" style="background: #3B82F6;">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
    </div>

    <div class="card">
      <div>
        <p class="card-label">Renda Média</p>
        <p class="card-value">R$ 3.170</p>
        <p class="card-subtitle">por habitante</p>
      </div>
      <div class="card-icon" style="background: #22C55E;">
        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
    </div>

    <div class="card">
      <div>
        <p class="card-label">Coleta de Lixo</p>
        <p class="card-value">1.289,8</p>
        <p class="card-subtitle">ton/mês</p>
      </div>
      <div class="card-icon" style="background: #F97316;">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </div>
    </div>

  </div>

</body>
</html>
